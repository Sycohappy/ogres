name: Build container images

on:
  push:
    branches:
      - homelab-deployment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/sycohappy/ogres-web
  BACKEND_IMAGE: ghcr.io/sycohappy/ogres-backend

jobs:
  web:
    name: Build web image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=homelab-deployment

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.dockerfile
          push: true
          build-args: |
            VERSION=selfhosted
            CLIENT_SOCKET_URL=wss://ogres.eashaantiwari.com/ws
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ogres-web
          cache-to: type=gha,mode=max,scope=ogres-web

  backend:
    name: Build backend image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=homelab-deployment

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ogres-backend
          cache-to: type=gha,mode=max,scope=ogres-backend
